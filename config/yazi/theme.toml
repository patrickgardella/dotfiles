#:schema https://yazi-rs.github.io/schemas/theme.json
# Solarized Dark for Yazi 26.9.1
# base03 #002b36 bg, base02 #073642, base01 #586e75, base00 #657b83
# base0 #839496, base1 #93a1a1, yellow #b58900, orange #cb4b16
# red #dc322f, magenta #d33682, violet #6c71c4, blue #268bd2, cyan #2aa198, green #859900

[mgr]
cwd = { fg = "#268bd2", bold = true }
find_keyword = { fg = "#b58900", bold = true }
find_position = { fg = "#d33682", bg = "#073642", bold = true }
symlink_target = { fg = "#2aa198" }
marker_copied = { fg = "#859900", bg = "#859900" }
marker_cut = { fg = "#dc322f", bg = "#dc322f" }
marker_marked = { fg = "#b58900", bg = "#b58900" }
marker_selected = { fg = "#268bd2", bg = "#268bd2" }
count_copied = { fg = "#859900", bold = true }
count_cut = { fg = "#dc322f", bold = true }
count_selected = { fg = "#268bd2", bold = true }
border_symbol = "│"
border_style = { fg = "#586e75" }

[tabs]
active = { fg = "#002b36", bg = "#268bd2", bold = true }
inactive = { fg = "#93a1a1", bg = "#073642" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#002b36", bg = "#268bd2", bold = true }
normal_alt = { fg = "#268bd2", bg = "#073642" }
select_main = { fg = "#002b36", bg = "#b58900", bold = true }
select_alt = { fg = "#b58900", bg = "#073642" }
unset_main = { fg = "#002b36", bg = "#d33682", bold = true }
unset_alt = { fg = "#d33682", bg = "#073642" }

[status]
overall = { fg = "#839496", bg = "#073642" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#268bd2" }
perm_read = { fg = "#b58900" }
perm_write = { fg = "#dc322f" }
perm_exec = { fg = "#859900" }
perm_sep = { fg = "#586e75" }
progress_label = { fg = "#839496", bold = true }
progress_normal = { fg = "#268bd2", bg = "#002b36" }
progress_error = { fg = "#dc322f", bg = "#002b36" }

[which]
cols = 3
mask = { bg = "#073642" }
cand = { fg = "#2aa198", bold = true }
rest = { fg = "#839496" }
desc = { fg = "#d33682" }
separator = " ➜ "
separator_style = { fg = "#586e75" }

[confirm]
border = { fg = "#586e75" }
title = { fg = "#268bd2", bold = true }
body = { fg = "#839496" }
list = { fg = "#93a1a1" }
btn_yes = { fg = "#002b36", bg = "#dc322f", bold = true }
btn_no = { fg = "#002b36", bg = "#93a1a1" }
btn_labels = ["  Yes  ", "  No  "]

[spot]
border = { fg = "#586e75" }
title = { fg = "#268bd2", bold = true }
tbl_col = { fg = "#268bd2", bold = true }
tbl_cell = { fg = "#b58900", bg = "#073642" }

[notify]
title_info = { fg = "#2aa198", bold = true }
title_warn = { fg = "#b58900", bold = true }
title_error = { fg = "#dc322f", bold = true }

[pick]
border = { fg = "#586e75" }
active = { fg = "#002b36", bg = "#268bd2", bold = true }
inactive = { fg = "#839496" }

[input]
border = { fg = "#268bd2" }
title = { fg = "#268bd2", bold = true }
value = { fg = "#839496" }
selected = { bg = "#073642" }

[cmp]
border = { fg = "#586e75" }
active = { fg = "#002b36", bg = "#268bd2", bold = true }
inactive = { fg = "#839496" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#586e75" }
title = { fg = "#268bd2", bold = true }
hovered = { fg = "#002b36", bg = "#268bd2", bold = true }

[help]
border = { fg = "#586e75" }
chord = { fg = "#2aa198", bold = true }
action = { fg = "#b58900" }
hovered = { fg = "#002b36", bg = "#268bd2", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#b58900" },
  { mime = "{audio,video}/*", fg = "#d33682" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma}", fg = "#dc322f" },
  { mime = "application/{pdf,doc,docx}", fg = "#2aa198" },
  { mime = "inode/empty", fg = "#2aa198" },
  { url = "*/", fg = "#268bd2", bold = true },
  { url = "*", is = "exec", fg = "#859900" },
  { url = "*", is = "orphan", fg = "#dc322f", bold = true },
]
