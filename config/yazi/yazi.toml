#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "no"
tab_size = 2
max_width = 600
max_height = 900
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = "nvim %s", desc = "nvim", block = true, for = "unix" },
]
open = [
  { run = "xdg-open %s1", desc = "Open", for = "linux" },
  { run = "open %s", desc = "Open", for = "macos" },
]
reveal = [
  { run = "xdg-open %d1", desc = "Reveal", for = "linux" },
  { run = "open -R %s1", desc = "Reveal", for = "macos" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = ["edit", "reveal"] },
  { mime = "application/{json,ndjson,javascript,xml}", use = ["edit", "reveal"] },
  { mime = "inode/empty", use = ["edit", "reveal"] },
]
